function renderParcelasPorBanco(){
 const el=document.getElementById('parcelasTabela'),filtro=document.getElementById('parcelasBancoFiltro');if(!el||!filtro)return;

 const periodo=document.getElementById('parcelasPeriodoFiltro')?.value||'todos';
 const nfFiltro=document.getElementById('parcelasNfFiltro')?.value||'todos';
 const mes=document.getElementById('parcelasMesFiltro')?.value||'';
 const inicio=document.getElementById('parcelasInicioFiltro')?.value||'';
 const fim=document.getElementById('parcelasFimFiltro')?.value||'';
 const mesAtual=day().slice(0,7);
 const rows=d.bills.filter(b=>{
  if(!(filtro.value==='todos'||(filtro.value==='sem-banco'?!b.entryAccount:b.entryAccount===filtro.value)))return false;

function saveFutureBill(e,i){

 const kind=baseMovement(movementId);

 if(kind==='Transferência'&&!(b.entryDestination||b.destinationAccount))return alert('Para mudar para Transferência, cadastre a conta de destino antes. Alteração cancelada.');

function deleteFutureBill(i){
 const b=d.bills.find(x=>x.id===i);
 if(!b||Number(b.paid||0)>0)return alert('Lançamentos com pagamento registrado não podem ser excluídos.');
 if(!confirm('Excluir este lançamento não pago?'))return;
 const previousBills=d.bills.slice();
 const rule=b.recurringRuleId?d.recurringRules.find(r=>r.id===b.recurringRuleId):null;
 const oldSkipped=rule?[...(rule.skippedMonths||[])]:null;
 // A competência original, não a data editada, impede que a recorrência reapareça.
 if(rule){rule.skippedMonths??=[];const month=b.scheduledMonth||b.due.slice(0,7);if(!rule.skippedMonths.includes(month))rule.skippedMonths.push(month);}
 d.bills=d.bills.filter(x=>x.id!==i);
 try{save('Lançamento não pago excluído: '+b.description+' '+b.due);}
 catch(err){d.bills=previousBills;if(rule)rule.skippedMonths=oldSkipped;alert('Não foi possível excluir: '+err.message);}
}

function parseSaldoBR(valor){
 let t=String(valor??'').trim().replace(/\s|\u00a0/g,'').replace(/^R\$/i,'');
 if(!t)return NaN;
 if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');
 else if(/^[-+]?\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');
 if(!/^[-+]?\d+(?:\.\d{1,2})?$/.test(t))return NaN;
 const n=Number(t);return Number.isFinite(n)?Math.round(n*100)/100:NaN;
}
function formatSaldoBR(input){const n=parseSaldoBR(input.value);if(Number.isFinite(n))input.value=money(n);}
function dataValidaISO(valor){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(valor))return false;
 const [ano,mes,dia]=valor.split('-').map(Number);
 const teste=new Date(Date.UTC(ano,mes-1,dia));
 return teste.getUTCFullYear()===ano&&teste.getUTCMonth()===mes-1&&teste.getUTCDate()===dia;
}

 ];

function cadastroNormalizar(texto){return String(texto??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR').replace(/[^a-z0-9]/g,'')}
function cadastroDistancia(a,b){if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;let anterior=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let atual=[i];for(let j=1;j<=b.length;j++)atual[j]=Math.min(atual[j-1]+1,anterior[j]+1,anterior[j-1]+(a[i-1]===b[j-1]?0:1));anterior=atual}return anterior[b.length]}
function cadastroCorresponde(item,termo){if(!termo)return true;let campos=[item.name,item.document,item.contact,item.notes,item.fantasyName,item.tradeName,item.address].filter(Boolean);return campos.some(c=>cadastroNormalizar(c).includes(termo))}
function cadastroSugestao(item,termo){if(!termo||termo.length<3)return false;let campos=[item.name,item.fantasyName,item.tradeName].filter(Boolean);return campos.some(c=>{let palavras=String(c).split(/\s+/).map(cadastroNormalizar).filter(Boolean);let candidatos=[cadastroNormalizar(c),...palavras];return candidatos.some(x=>{let limite=Math.min(3,Math.max(1,Math.floor(Math.max(x.length,termo.length)*0.25)));return Math.abs(x.length-termo.length)<=limite&&cadastroDistancia(x,termo)<=limite})})}
function listInUse(type,item){
 if(type==='movement'){
  // A natureza financeira (Despesa/Receita/Transferência) não identifica
  // uma opção personalizada. Usar exclusivamente o ID do tipo escolhido.
  const isDefault=['Despesa','Receita','Transferência'].includes(item.id);
  if(isDefault){
   // Tipos nativos podem existir em registros legados sem ID de subtipo.
   return d.bills.some(b=>(b.movementTypeId||b.entryKind)===item.id)||
    d.moves.some(m=>(m.movementTypeId||m.kind)===item.id)||
    d.recurringRules.some(r=>(r.movementTypeId||r.entryKind)===item.id);
  }
  return d.bills.some(b=>b.movementTypeId===item.id)||
   d.moves.some(m=>m.movementTypeId===item.id)||
   d.recurringRules.some(r=>r.movementTypeId===item.id);
 }
 if(type==='category')return d.bills.some(b=>b.category===item.id)||
  d.moves.some(m=>m.category===item.id)||
  d.recurringRules.some(r=>r.category===item.id);
 return d.bills.some(b=>b.method===item.id)||
  d.moves.some(m=>m.paymentMethod===item.id)||
  d.recurringRules.some(r=>r.method===item.id);
}

 root.innerHTML=`<div class="row"><label>Novo item<input id="listNewName" maxlength="90" placeholder="Nome da opção"></label><button type="button" onclick="addListItem()">Adicionar</button></div><label>Pesquisar nas opções<input id="listSearch" type="search" placeholder="Buscar com ou sem acentos" value="${safe(document.getElementById('listSearch')?.value||'')}" oninput="filtrarLinhasLista()" autocomplete="off"></label><div class="scroll" id="listManagerTable">${table(['Nome','Natureza','Situação','Uso','Ações'],rows)}</div>`;filtrarLinhasLista();

function normalizarBuscaTexto(texto){
 return String(texto??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLocaleLowerCase('pt-BR').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
}
function formatarNomeLista(texto){
 const excecoes=new Set(['de','da','do','das','dos','e','em','para','por','com']);
 const siglas=new Set(['pix','iof','cpf','cnpj','nf','ted','doc']);
 return normalizarBuscaTexto(texto).split(' ').filter(Boolean).map((parte,i)=>{
  if(siglas.has(parte))return parte.toUpperCase();
  if(i>0&&excecoes.has(parte))return parte;
  return parte.charAt(0).toLocaleUpperCase('pt-BR')+parte.slice(1);
 }).join(' ');
}
function filtrarLinhasLista(){
 const termo=normalizarBuscaTexto(document.getElementById('listSearch')?.value||'');
 const tbody=document.querySelector('#listManagerTable table');
 if(!tbody)return;
 for(const tr of [...tbody.querySelectorAll('tr')].slice(1)){
  const label=tr.cells[0]?.textContent||'';
  tr.style.display=!termo||normalizarBuscaTexto(label).includes(termo)?'':'none';
 }
}
function sugerirNaturezaFinanceira(nome,atual){
 const texto=normalizarBuscaTexto(nome);
 const regras=[
  {base:'Despesa',termos:[/\bjuros? pagos?\b/,/\btarifas?\b/,/\biof\b/,/\bmultas? pagas?\b/,/\baluguel\b/,/\bsalarios?\b/,/\bfornecedores?\b/,/\bconta de luz\b/,/\bdespesas?\b/,/\bpagamento de boleto\b/]},
  {base:'Receita',termos:[/\brendimentos?\b/,/\bjuros? recebidos?\b/,/\brecebimentos?\b/,/\bvendas?\b/,/\bfaturamento\b/,/\breceitas?\b/,/\bcredito de juros\b/,/\bcashback recebido\b/]},
  {base:'Transferência',termos:[/\btransferencia entre contas\b/,/\btransferencia interna\b/,/\bmovimentacao entre contas\b/]}
 ];
 if(/\bestorno\b|\bdevolucao\b|\breembolso\b|\bemprestimo\b|\badiantamento\b|\bajuste\b/.test(texto))return null;
 const candidatas=regras.filter(r=>r.termos.some(t=>t.test(texto))).map(r=>r.base);
 return candidatas.length===1&&candidatas[0]!==atual?candidatas[0]:null;
}
function identificarDevolucao(nome){
 const t=normalizarBuscaTexto(nome);
 if(!/\b(devolucao|estorno|reembolso|ressarcimento)\b/.test(t))return null;
 if(/\b(entre contas|contas proprias|conta propria|transferencia interna)\b/.test(t))return 'Transferência';
 if(/\b(ao cliente|para cliente|ao comprador|pago ao cliente|devolucao paga|reembolso pago|valor devolvido ao cliente)\b/.test(t))return 'Despesa';
 if(/\b(do fornecedor|pelo fornecedor|recebido|recebida|estorno recebido|valor devolvido pelo fornecedor)\b/.test(t))return 'Receita';
 return 'ambigua';
}
function confirmarDevolucao(nome,atual){
 const tipo=identificarDevolucao(nome);
 if(!tipo)return Promise.resolve(atual);
 return new Promise(resolve=>{
  const root=document.getElementById('modalRoot');
  if(!root)return resolve(null);
  const original=root.innerHTML;
  const descricao=tipo==='ambigua'
   ?'O nome não indica se o dinheiro entrou, saiu ou foi transferido. Escolha a natureza conforme a operação real.'
   :'A descrição sugere '+tipo+', mas confira se corresponde à movimentação bancária.';
  root.innerHTML=`<div class="modal"><div class="card" role="dialog" aria-modal="true" aria-label="Conferir devolução financeira"><h3>Conferir devolução ou estorno</h3><p><strong>${safe(nome)}</strong></p><p>${safe(descricao)}</p><label>Natureza financeira<select id="devolucaoNatureza"><option value="Despesa">Saída de dinheiro (Despesa / estorno de receita)</option><option value="Receita">Entrada de dinheiro (Receita / estorno de despesa)</option><option value="Transferência">Transferência entre contas próprias</option></select></label><p class="muted">A natureza controla o sentido do dinheiro no caixa. O tratamento contábil de um estorno deve ser definido separadamente.</p><div class="actions"><button type="button" data-devolucao="confirmar">Confirmar classificação</button><button type="button" class="secondary" data-devolucao="cancelar">Cancelar</button></div></div></div>`;
  const select=root.querySelector('#devolucaoNatureza');select.value=tipo==='ambigua'?atual:tipo;
  root.querySelectorAll('[data-devolucao]').forEach(btn=>btn.addEventListener('click',()=>{
   const escolha=btn.dataset.devolucao==='cancelar'?null:select.value;
   root.innerHTML=original;
   resolve(escolha);
  },{once:true}));
 });
}
function confirmarNatureza(nome,atual,sugerida){
 return new Promise(resolve=>{
  if(!sugerida)return resolve(atual);
  const root=document.getElementById('modalRoot');
  if(!root)return resolve(atual);
  const original=root.innerHTML;
  root.innerHTML=`<div class="modal"><div class="card" role="dialog" aria-modal="true" aria-label="Possível classificação incorreta"><h3>Possível classificação incorreta</h3><p>O nome <strong>${safe(nome)}</strong> normalmente é classificado como <strong>${safe(sugerida)}</strong>, mas você selecionou <strong>${safe(atual)}</strong>.</p><p>Confira a natureza financeira. A decisão final é sua.</p><div class="actions"><button type="button" data-choice="correct">Corrigir para ${safe(sugerida)}</button><button type="button" class="secondary" data-choice="keep">Manter ${safe(atual)}</button><button type="button" class="secondary" data-choice="cancel">Cancelar</button></div></div></div>`;
  root.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>{
   const choice=button.dataset.choice;
   root.innerHTML=original;
   resolve(choice==='cancel'?null:choice==='correct'?sugerida:atual);
  },{once:true}));
 });
}
async function addListItem(){
 const type=document.getElementById('listType')?.value,base=document.getElementById('listBase')?.value;
 const label=formatarNomeLista(document.getElementById('listNewName')?.value||'');
 if(!label||label.length>90)return alert('Informe um nome de até 90 caracteres.');
 if(d.listSettings[type].some(x=>cadastroNormalizar(x.label)===cadastroNormalizar(label)))return alert('Essa opção já existe.');
 let natureza=base;
 if(type!=='method'){
  if(identificarDevolucao(label))natureza=await confirmarDevolucao(label,base);
  else natureza=await confirmarNatureza(label,base,sugerirNaturezaFinanceira(label,base));
  if(natureza===null)return;
 }
 const item={id:'custom_'+id(),label,active:true};
 if(type!=='method')item.base=natureza;
 d.listSettings[type].push(item);
 try{
  save('Opção cadastrada: '+label+'; natureza: '+(natureza||'forma de pagamento')+(natureza!==base?' (corrigida após sugestão)':''));
 }catch(err){d.listSettings[type].pop();alert(err.message)}
}

 </select></label>`}

 <label>Situação<select name="situacao">

function salvarAlteracaoLista(event,type,itemId){
 event.preventDefault();
 const item=d.listSettings[type]?.find(x=>x.id===itemId);
 if(!item)return alert('Opção não encontrada.');
 const form=new FormData(event.target);
 const nome=String(form.get('nome')||'').trim();
 const ativo=form.get('situacao')==='ativo';
 const usada=listInUse(type,item);
 const natureza=type==='method'?undefined:(usada?item.base:String(form.get('natureza')||''));
 if(!nome||nome.length>90)return alert('Nome inválido.');
 if(d.listSettings[type].some(x=>x.id!==itemId&&cadastroNormalizar(x.label)===cadastroNormalizar(nome)))
  return alert('Já existe outra opção com esse nome.');
 if(type!=='method'&&!['Despesa','Receita','Transferência'].includes(natureza))
  return alert('Natureza financeira inválida.');
 if(type==='movement'&&!ativo&&item.active!==false&&
   d.listSettings.movement.filter(x=>x.active!==false&&x.base===item.base).length<=1)
  return alert('Não é permitido inativar o último tipo desta natureza.');
 if(type==='movement'&&!usada&&natureza!==item.base&&
   d.listSettings.movement.filter(x=>x.active!==false&&x.base===item.base&&x.id!==item.id).length===0)
  return alert('É necessário manter outro tipo ativo na natureza anterior.');
 const anterior={...item};
 item.label=nome;
 item.active=ativo;
 if(type!=='method')item.base=natureza;
 try{
  save('Lista alterada: '+anterior.label+' -> '+nome);
  closeModal();
 }catch(erro){
  Object.assign(item,anterior);
  alert('Não foi possível salvar: '+erro.message);
 }
}
function toggleListItem(type,itemId){
 const item=d.listSettings[type]?.find(x=>x.id===itemId);if(!item)return;
 if(item.active!==false&&type==='movement'&&d.listSettings.movement.filter(x=>x.active!==false&&x.base===item.base).length===1)return alert('Não é permitido ocultar o último tipo ativo desta natureza.');
 const previous=item.active;item.active=item.active===false;
 try{save('Opção '+item.label+(item.active?' reativada':' inativada'))}catch(err){item.active=previous;alert(err.message)}
}
function deleteListItem(type,itemId){
 const list=d.listSettings[type],item=list?.find(x=>x.id===itemId);if(!item)return;
 if(listInUse(type,item))return alert('Esta opção já foi utilizada em lançamentos. Não pode ser excluída; utilize Inativar.');
 if(type==='movement'&&list.filter(x=>x.active!==false&&x.base===item.base).length<=1)return alert('Mantenha pelo menos um tipo ativo por natureza.');
 if(!confirm('Excluir definitivamente a opção '+item.label+'?'))return;
 const index=list.indexOf(item);list.splice(index,1);
 try{save('Opção excluída: '+item.label)}catch(err){list.splice(index,0,item);alert(err.message)}
}
function renderCadastroTable(){let el=document.getElementById('cadastroTable');if(!el)return;let termo=cadastroNormalizar(document.getElementById('cadastroBusca')?.value||'');let ordenados=d.suppliers.slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'pt-BR',{sensitivity:'base',numeric:true}));let exatos=ordenados.filter(x=>cadastroCorresponde(x,termo));let sugestoes=termo?ordenados.filter(x=>!cadastroCorresponde(x,termo)&&cadastroSugestao(x,termo)):[];let linhas=itens=>itens.map(x=>`<tr><td>${safe(x.name)}</td><td>${safe(x.document||'—')}</td><td>${safe(x.contact||'—')}</td><td>${d.bills.filter(b=>b.supplierId===x.id).length}</td><td><button type="button" onclick="openEditCadastro('${x.id}')">Editar</button></td></tr>`);let cabecalho=['Fornecedor','CPF/CNPJ','Contato','Obrigações','Ação'];el.innerHTML=exatos.length?table(cabecalho,linhas(exatos)):'<p class="muted">Nenhum cadastro encontrado com essa pesquisa.</p>';if(sugestoes.length)el.innerHTML+='<h4>Você quis dizer?</h4>'+table(cabecalho,linhas(sugestoes));}

function saveEditCadastro(event,cadastroId){
  event.preventDefault();
  const item=d.suppliers.find(x=>x.id===cadastroId);
  if(!item)return alert('Cadastro não encontrado.');
  const form=new FormData(event.target);
  const nome=String(form.get('name')||'').trim();
  const documento=String(form.get('document')||'').trim();
  if(!nome)return alert('Informe o nome ou razão social.');
  const normalizarDocumento=v=>String(v||'').replace(/\D/g,'');
  const duplicado=d.suppliers.some(x=>x.id!==cadastroId&&(
    (documento&&normalizarDocumento(x.document)===normalizarDocumento(documento))||
    cadastroNormalizar(x.name)===cadastroNormalizar(nome)
  ));
  if(duplicado)return alert('Já existe outro cadastro com esse nome ou CPF/CNPJ.');
  const atualizado={name:nome,document:documento,fantasyName:String(form.get('fantasyName')||'').trim(),address:String(form.get('address')||'').trim(),contact:String(form.get('contact')||'').trim(),notes:String(form.get('notes')||'').trim()};
  const anterior={...item};
  Object.assign(item,atualizado);
  const registro=new Date().toLocaleString('pt-BR')+' — Cadastro editado: '+anterior.name+' → '+nome;
  d.audit.push(registro);
  try{dbSet(JSON.stringify(d))}
  catch(err){Object.assign(item,anterior);d.audit.pop();return alert('Não foi possível salvar: '+err.message)}
  closeModal();
  if(tab===2)renderCadastroTable();
  if(tab===3){
    const selecionado=document.getElementById('supplierId');
    if(selecionado?.value===cadastroId){
      const display=document.getElementById('supplierDisplay');
      if(display)display.value=item.name+(item.document?' — '+item.document:'');
    }
    const proximos=document.getElementById('upcomingPayments');
    if(proximos?.style.display==='block'&&selecionado?.value===cadastroId)showUpcomingPayments();
  }
}

function filtrarOpcoesLancamento(id,term){
 const select=document.getElementById(id);
 if(!select)return;

 const tipo=id==='supplierEntryCategory'?'category':
   id==='supplierEntryKind'?'movement':null;
 if(!tipo)return;

 const campo=tipo==='category'?

function addMonthsISO(start,offset,day){
 const [year,month]=start.slice(0,7).split('-').map(Number);
 const first=new Date(Date.UTC(year,month-1+offset,1));
 const y=first.getUTCFullYear(),m=first.getUTCMonth()+1;
 const last=new Date(Date.UTC(y,m,0)).getUTCDate();
 return `${y}-${String(m).padStart(2,'0')}-${String(Math.min(day,last)).padStart(2,'0')}`;
}
function generateRecurringBills(){

  const first=rule.start;
  if(!dataValidaISO(first))continue;
  for(let index=0;index<months;index++){
   const due=addMonthsISO(first,index,Number(rule.day)||Number(first.slice(-2)));
   if((rule.skippedMonths||[]).includes(due.slice(0,7))||d.bills.some(b=>b.recurringRuleId===rule.id&&(b.scheduledMonth||b.due.slice(0,7))===due.slice(0,7)))continue;

async function importarPlanilhaLancamentos(event){
 const file=event.target.files?.[0];event.target.value='';if(!file)return;

  if(!ext)throw new Error('Use planilha XLSX ou CSV.');
  if(file.size>4*1024*1024)throw new Error('Planilha acima de 4 MB.');
  const resp=await fetch('/api/planilha-lancamentos',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-File-Extension':ext},body:file});
  const result=await resp.json();if(!resp.ok)throw new Error(result.erro||'Falha ao ler planilha.');
  const novos=[],repetidos=[],erros=[],vistos=new Set();
  for(const [i,row] of result.rows.entries()){
   const due=row.vencimento,amount=Number(row.valor),description=String(row.descricao||'').trim();
   const recebedor=String(row.recebedor||'').trim();
   const norm=cadastroNormalizar;

   if(!dataValidaISO(due)||!Number.isFinite(amount)||amount<=0||!description){erros.push('Linha '+(i+2)+': vencimento, valor ou descrição inválidos');continue}
   if(Number(row.pago||0)>0){erros.push('Linha '+(i+2)+': pagamento já registrado; não é permitido importar como obrigação em aberto');continue}
   const entryKind=row.tipo==='Receita'?'Receita':'Despesa';
   const chave=[account,due,Math.round(amount*100),matches[0].id,norm(description),entryKind].join('|');
   if(vistos.has(chave)){repetidos.push(i+2);continue}
   vistos.add(chave);
   const duplicate=d.bills.some(b=>b.entryAccount===account&&b.due===due&&Math.round(Number(b.amount)*100)===Math.round(amount*100)&&b.supplierId===matches[0].id&&cadastroNormalizar(b.description)===norm(description)&&b.entryKind===entryKind);
   if(duplicate){repetidos.push(i+2);continue}
   novos.push({id:id(),group:id(),supplierId:matches[0].id,entryKind,entryAccount:account,name:matches[0].name,description,category:row.categoria||'Outras despesas',amount,paid:0,due,method:row.forma||'Não definido',notes:row.observacoes||'',nfStatus:row.nf||'Não definido',recurring:false,installment:1,totalInstallments:1});
  }
  if(erros.length)throw new Error('Importação cancelada sem gravar dados:\n'+erros.slice(0,8).join('\n'));
  if(!novos.length)return alert('Nenhum lançamento novo. Já existentes: '+repetidos.length);
  if(!confirm('Conta: '+name(account)+'\nNovos lançamentos: '+novos.length+'\nJá existentes: '+repetidos.length+'\nImportar como obrigações em aberto (sem baixa automática)?'))return;
  const before=d.bills.slice(),audit=d.audit.slice();
  d.bills.push(...novos);

 const data=normalizarDataConciliacao(row.date)||String(row.date||'');

 return account+'|'+data+'|'+centavos+'|'+descricao;

function identificarBancoSelecionado(account,format){
 const conta=d.accounts.find(a=>a.id===account);
 if(!conta)throw new Error('Conta bancária selecionada não existe.');
 if(!format||!format.bank||!format.layout)throw new Error('Não foi possível identificar com segurança o layout bancário. Nenhuma movimentação importada.');
 const banco=cadastroNormalizar(format.bank),nome=cadastroNormalizar(conta.name);
 const conhecidos=['itau','bradesco','sicoob','inter','santander','nubank'];
 const declarado=conhecidos.find(x=>nome.includes(x));
 if(declarado&&declarado!==banco)throw new Error('O extrato é do '+format.bank+', mas a conta selecionada é '+conta.name+'. Selecione a conta correta.');
 if(!declarado)throw new Error('O nome da conta cadastrada não identifica o banco '+format.bank+'. Atualize o nome da conta para incluir o banco antes de importar.');
 const digits=x=>String(x||'').replace(/\D/g,'').replace(/^0+/,'')||'0';
 if(format.checking&&conta.checking&&digits(format.checking)!==digits(conta.checking))
  throw new Error('Número da conta no extrato ('+format.checking+') difere do cadastro ('+conta.checking+'). Nenhum movimento importado.');
 if(format.agency&&conta.agency&&digits(String(format.agency).split('-')[0])!==digits(String(conta.agency).split('-')[0]))
  throw new Error('Agência do extrato ('+format.agency+') difere do cadastro ('+conta.agency+'). Nenhum movimento importado.');
 const anterior=d.statementFormats?.[account];
 if(anterior&&anterior.startsWith('perfil:')&&cadastroNormalizar(anterior.split(':')[1])!==banco)
  throw new Error('O perfil anterior pertence a outro banco. Nenhuma movimentação foi importada.');
 return conta;
}
function importarLinhasSemDuplicidade(account,rows){
 const existentes=new Map(),vistos=new Map(),novos=[];
 for(const old of d.bank.filter(x=>x.account===account)){
  const chave=chaveMovimentoImportado(account,old);
  existentes.set(chave,(existentes.get(chave)||0)+1);
 }
 let duplicados=0;
 for(const r of rows){
  const data=normalizarDataConciliacao(r.date),valor=Number(r.amount),desc=String(r.description||'').trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(data)||!Number.isFinite(valor)||valor===0||!desc)
   throw new Error('Movimentação inválida no extrato. Importação cancelada sem alterações.');
  const row={date:data,amount:valor,description:desc};
  const chave=chaveMovimentoImportado(account,row);
  const ocorrencia=(vistos.get(chave)||0)+1;
  vistos.set(chave,ocorrencia);
  let quantidade=existentes.get(chave)||0;
  if(!quantidade){
   // Compatibilidade com lançamentos de importadores anteriores que armazenavam
   // somente o histórico principal, sem a informação complementar.
   const relacionados=d.bank.filter(old=>old.account===account&&normalizarDataConciliacao(old.date)===data&&
    Math.round(Number(old.amount)*100)===Math.round(valor*100));
   quantidade=relacionados.filter(old=>{
    const a=cadastroNormalizar(old.description),b=cadastroNormalizar(desc);
    return a.length>=10&&b.length>=10&&(a===b||a.startsWith(b)||b.startsWith(a));
   }).length;
  }
  if(ocorrencia<=quantidade){duplicados++;continue}
  novos.push({id:id(),unique:chave+'|'+ocorrencia,account,date:data,amount:valor,description:desc,match:null,
    bankTransactionId:String(r.bank_id||'')});
 }
 return {novos,duplicados};
}
async function importExtrato(e){
 const file=e.target.files?.[0];if(!file)return;
 const extension='.'+file.name.split('.').pop().toLowerCase();
 const account=document.getElementById('imp')?.value;
 if(!['.csv','.xls','.xlsx','.pdf'].includes(extension)){
  alert('Selecione CSV, XLS, XLSX ou PDF.');e.target.value='';return;
 }
 if(!account){alert('Selecione uma conta antes de importar.');e.target.value='';return}
 try{
  const response=await fetch('/api/parse-extrato',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-File-Extension':extension},body:file});
  const result=await response.json();
  if(!response.ok)throw new Error(result.erro||'Falha ao ler o extrato.');
  const format=result.format;
  const conta=identificarBancoSelecionado(account,format);
  const rows=result.rows||[];
  if(!rows.length)throw new Error('O arquivo não contém movimentações reconhecidas.');
  const opening=conta.openingDate;
  if(!dataValidaISO(opening))throw new Error('Cadastre a data do saldo inicial da conta antes de importar.');
  const validos=rows.filter(r=>normalizarDataConciliacao(r.date)>=opening);
  const anteriores=rows.length-validos.length;
  const conflicts=[];
  for(const r of validos){
   const ref=String(r.bank_id||'').trim();
   if(!ref||ref.toLowerCase()==='pix')continue;
   const candidates=d.bank.filter(x=>x.account===account&&String(x.bankTransactionId||'').trim()===ref);
   if(candidates.some(x=>normalizarDataConciliacao(x.date)!==normalizarDataConciliacao(r.date)||
      Math.round(Number(x.amount)*100)!==Math.round(Number(r.amount)*100))){
     conflicts.push('Identificador '+ref+': data ou valor diferente do registro existente.');
   }
  }
  const balances=result.daily_balances||{};
  for(const [date,value] of Object.entries(balances)){
   if(date<opening)continue;
   const existing=d.bankDailyBalances?.[account]?.[date];
   if(existing!==undefined&&Math.round(Number(existing)*100)!==Math.round(Number(value)*100))
    conflicts.push('Saldo de '+dataBR(date)+': existente '+money(existing)+'; novo '+money(value)+'.');
  }
  if(conflicts.length){
   throw new Error('Conflito com extrato já importado. Nenhum registro foi alterado:\n'+conflicts.slice(0,8).join('\n'));
  }
  const {novos,duplicados}=importarLinhasSemDuplicidade(account,validos);
  const futuros=result.future_rows||[];
  const aviso='Banco: '+format.bank+'\nConta: '+conta.name+'\nMovimentações no arquivo: '+rows.length+
   '\nNovas: '+novos.length+'\nJá importadas: '+duplicados+'\nAntes do saldo inicial (ignoradas): '+anteriores+'\nSaldos diários identificados: '+Object.keys(balances).length;
  if(!novos.length&&!Object.keys(balances).length&&!futuros.length){alert(aviso+'\nNenhuma alteração necessária.');return}
  if(!confirm(aviso+'\n\nConfirmar a importação?'))return;
  const bankBefore=d.bank.slice(),futureBefore=JSON.stringify(d.futureBank||[]),balancesBefore=JSON.stringify(d.bankDailyBalances||{}),formatsBefore=JSON.stringify(d.statementFormats||{});
  try{
   d.bank.push(...novos);
   d.futureBank??=[];
   const currentKeys=new Set(d.futureBank.filter(x=>x.account===account).map(x=>x.unique));
   const seen=new Map();
   for(const r of futuros){
    const amount=Number(r.amount),date=String(r.date||''),description=String(r.description||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<opening||!Number.isFinite(amount)||!description)continue;
    const base=account+'|'+date+'|'+amount.toFixed(2)+'|'+description.toLowerCase();
    const occurrence=(seen.get(base)||0)+1;seen.set(base,occurrence);
    const unique=base+'|'+occurrence;
    if(!currentKeys.has(unique)){d.futureBank.push({id:id(),unique,account,date,amount,description,source:format.bank});currentKeys.add(unique)}
   }

   d.bankDailyBalances??={};d.bankDailyBalances[account]??={};
   for(const [date,value] of Object.entries(balances)){
    if(/^\d{4}-\d{2}-\d{2}$/.test(date)&&date>=opening&&Number.isFinite(Number(value)))
     d.bankDailyBalances[account][date]=Number(value);
   }
   d.statementFormats??={};d.statementFormats[account]='perfil:'+format.bank+':'+format.layout;
   save('Extrato '+format.bank+' ('+extension+') — '+novos.length+' novos, '+duplicados+' já existentes');
  }catch(error){
   d.bank=bankBefore;d.futureBank=JSON.parse(futureBefore);d.bankDailyBalances=JSON.parse(balancesBefore);d.statementFormats=JSON.parse(formatsBefore);
   throw new Error('Falha ao gravar no SQLite: '+error.message);
  }
  alert(novos.length+' movimentação(ões) nova(s). '+duplicados+' já existentes foram ignoradas.');
 }catch(error){alert('Importação cancelada: '+error.message)}
 finally{e.target.value=''}
}

function abrirCadastroExtrato(bankId){

 if(!b||b.match)return;
 const root=document.getElementById('modalRoot');

function registrarMovimentoExtrato(event,bankId){
 event.preventDefault();
 const b=d.bank.find(x=>x.id===bankId);if(!b||b.match)return alert('Movimentação já conciliada ou não localizada.');
 const amount=Math.abs(Number(b.amount)),tipo=Number(b.amount)>0?'Receita':'Despesa';
 if(!Number.isFinite(amount)||amount<=0||!d.accounts.some(a=>a.id===b.account))return alert('Movimentação inválida.');
 const f=new FormData(event.target),acao=f.get('acao');
 const backup={moves:d.moves.slice(),bills:d.bills.slice(),bank:d.bank.slice(),audit:d.audit.slice()};

 if(acao==='existente'){

  if(!bill||((bill.entryKind||'Despesa')!==tipo)|| (bill.entryAccount&&bill.entryAccount!==b.account)||valorCentavos(bill.amount-bill.paid)<valorCentavos(amount))return alert('Obrigação incompatível ou já liquidada.');
  const antiga={...bill};

  d.moves.push(movimento);

 }
 if(acao!=='novo')return alert('Selecione a operação.');

 if(!desc)return alert('Informe a descrição.');
 const supplier=d.suppliers.find(x=>x.id===supplierId);
 const bill={id:id(),group:id(),supplierId:supplier?.id||null,name:supplier?.name||'',entryKind:tipo,entryAccount:b.account,description:desc,category:String(f.get('category')||'Outras despesas'),amount,paid:amount,due:normalizarDataConciliacao(b.date),method:String(f.get('method')||'PIX'),notes:'Criado a partir de movimentação importada',recurring:false,installment:1,totalInstallments:1};
 movimento={id:id(),kind:tipo,date:bill.due,amount,account:b.account,description:desc,category:bill.category,billId:bill.id,paymentMethod:bill.method,sourceBankId:b.id};
 d.bills.push(bill);d.moves.push(movimento);b.match=movimento.id;
 try{save('Lançamento e baixa criados do extrato: '+desc);closeModal()}catch(err){d.bills=backup.bills;d.moves=backup.moves;b.match=null;d.audit=backup.audit;alert('Falha ao salvar: '+err.message)}
}
function movimentoAssinado(m,account){
 if(m.kind==='Transferência')return m.account===account?-Number(m.amount):m.to===account?Number(m.amount):null;
 if(m.account!==account)return null;
 return m.kind==='Receita'?Number(m.amount):-Number(m.amount);
}
function normalizarDataConciliacao(value){
 const t=String(value||'').trim();
 if(/^\d{2}\/\d{2}\/\d{4}$/.test(t)){const [dia,mes,ano]=t.split('/');return ano+'-'+mes+'-'+dia}
 return t.slice(0,10);
}
function valorCentavos(value){return Math.round(Number(value)*100)}
function buscarCandidatosConciliacao(b){
 const usados=new Set(d.bank.filter(x=>x.match&&x.id!==b.id).map(x=>x.match));
 return d.moves.filter(m=>!usados.has(m.id)&&normalizarDataConciliacao(m.date)===normalizarDataConciliacao(b.date)&&
  movimentoAssinado(m,b.account)!==null&&valorCentavos(movimentoAssinado(m,b.account))===valorCentavos(b.amount));
}
function desfazerConciliacao(bankId){
 const b=d.bank.find(x=>x.id===bankId);if(!b||!b.match)return;
 const linked=d.moves.find(m=>m.id===b.match);
 const generated=linked&&d.bills.some(x=>x.id===linked.billId);
 const warning=generated?'\n\nAtenção: o lançamento e a baixa vinculados serão PRESERVADOS. Revise-os em Lançamentos para evitar valores incorretos.':'';
 if(!confirm('Desfazer a conciliação de '+dataBR(b.date)+' — '+money(b.amount)+'?\nO registro do extrato será preservado.'+warning))return;
 const old=b.match,auditLength=d.audit.length;
 b.match=null;
 d.audit.push(new Date().toLocaleString('pt-BR')+' — Conciliação desfeita: '+b.description+' | vínculo anterior '+old);
 try{dbSet(JSON.stringify(d));render()}
 catch(error){b.match=old;d.audit.length=auditLength;alert('Falha ao desfazer conciliação: '+error.message)}
}
function reconcile(i){
 const b=d.bank.find(x=>x.id===i);if(!b||b.match)return;
 const candidatos=buscarCandidatosConciliacao(b);
 const root=document.getElementById('modalRoot');if(!root)return;
 root.innerHTML=`<div class="modal"><div class="card" style="width:min(740px,96vw)"><h3>Conferir conciliação</h3>
 <p><strong>${safe(dataBR(b.date))}</strong> — ${safe(b.description)} — ${money(b.amount)}</p><p>Conta: ${safe(name(b.account))}</p>
 ${candidatos.length?`<label>Selecione o lançamento financeiro<select id="conciliacaoCandidato">${candidatos.map(m=>`<option value="${safe(m.id)}">${safe(m.description)} — ${money(m.amount)} — ${safe(dataBR(m.date))}</option>`).join('')}</select></label>`:'<p class="warn">Não existe lançamento baixado com a mesma conta, data e valor. Você pode cadastrar e baixar uma obrigação nesta tela, ou revisar um lançamento existente na aba Lançamentos.</p>'}
 <div class="actions">${candidatos.length?`<button type="button" onclick="confirmarCandidatoConciliacao('${b.id}')">Conciliar selecionado</button>`:''}<button type="button" class="secondary" onclick="openExtratoLancamento('${b.id}')">Cadastrar ou baixar lançamento</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></div></div>`;
}
function confirmarCandidatoConciliacao(bankId){
 const b=d.bank.find(x=>x.id===bankId);if(!b||b.match)return;
 const candidateId=document.getElementById('conciliacaoCandidato')?.value;
 const m=buscarCandidatosConciliacao(b).find(x=>x.id===candidateId);
 if(!m)return alert('Lançamento indisponível. Atualize a consulta.');
 if(!confirm('Confirmar vínculo entre extrato e lançamento selecionado?'))return;
 const old=b.match;b.match=m.id;
 try{closeModal();save('Conciliação manual confirmada: '+b.description)}catch(err){b.match=old;alert('Não foi possível gravar: '+err.message)}
}
function saldoAteData(account,date){
 const a=d.accounts.find(x=>x.id===account);if(!a)return null;
 if(a.openingDate&&date<a.openingDate)return null;
 return Number(a.opening||0)+d.moves.reduce((total,m)=>{
  const md=normalizarDataConciliacao(m.date);
  if(!md||md>date||(a.openingDate&&md<a.openingDate))return total;
  const v=Number(m.amount||0);
  return total+(m.account===account?(m.kind==='Receita'?v:-v):0)+(m.kind==='Transferência'&&m.to===account?v:0);
 },0);
}
function alternarModoFechamento(){
 const periodo=document.getElementById('closeMode')?.value==='periodo';
 for(const [id,show] of [['closeDateBox',!periodo],['closeStartBox',periodo],['closeEndBox',periodo],['closeBankBalanceBox',!periodo]]){
  const el=document.getElementById(id);if(el)el.style.display=show?'':'none';
 }
 if(!periodo)atualizarSaldoFechamento();
 renderFechamentoDetalhes();
}
function datasDoPeriodo(inicio,fim){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(inicio)||!/^\d{4}-\d{2}-\d{2}$/.test(fim))throw new Error('Informe as datas inicial e final.');
 if(inicio>fim)throw new Error('A data inicial deve ser anterior ou igual à final.');
 if(inicio.slice(0,7)!==fim.slice(0,7))throw new Error('O período deve estar dentro do mesmo mês e ano.');
 const datas=[], cursor=new Date(inicio+'T12:00:00'), limite=new Date(fim+'T12:00:00');
 if(Number.isNaN(cursor.getTime())||Number.isNaN(limite.getTime()))throw new Error('Datas inválidas.');
 while(cursor<=limite){
  const data=[cursor.getFullYear(),String(cursor.getMonth()+1).padStart(2,'0'),String(cursor.getDate()).padStart(2,'0')].join('-');
  datas.push(data);
  cursor.setDate(cursor.getDate()+1);
  if(datas.length>31)throw new Error('O período não pode ultrapassar um mês.');
 }
 if(datas[0]!==inicio||datas[datas.length-1]!==fim)throw new Error('Datas inválidas.');
 return datas;
}

function renderHistoricoFechamentos(){
 const root=document.getElementById('historicoFechamentosTabela');if(!root)return;
 const conta=document.getElementById('historicoFechamentoConta')?.value||'todos';
 const modo=document.getElementById('historicoFechamentoModo')?.value||'12';
 const mes=document.getElementById('historicoFechamentoMes')?.value||'';
 const dia=document.getElementById('historicoFechamentoDia')?.value||'';
 const hoje=new Date(),inicio=new Date(hoje.getFullYear(),hoje.getMonth()-11,1);
 const limite=[inicio.getFullYear(),String(inicio.getMonth()+1).padStart(2,'0')].join('-');
 const rows=d.closed.filter(x=>{
  if(conta!=='todos'&&x.account!==conta)return false;
  const data=normalizarDataConciliacao(x.date);
  if(!data)return false;
  if(modo==='dia')return data===dia;
  if(modo==='mes')return data.slice(0,7)===mes;
  return data.slice(0,7)>=limite&&data<=day();
 }).slice().sort((a,b)=>String(normalizarDataConciliacao(b.date)).localeCompare(String(normalizarDataConciliacao(a.date)))||name(a.account).localeCompare(name(b.account),'pt-BR'));
 root.innerHTML='<p class="muted">'+rows.length+' fechamento(s) encontrado(s).</p>'+table(['Conta','Data','Saldo do banco'],rows.map(x=>`<tr><td>${safe(name(x.account))}</td><td>${dataBR(normalizarDataConciliacao(x.date))}</td><td>${Number.isFinite(Number(x.bankBalance))&&x.bankBalance!==undefined&&x.bankBalance!==null?money(x.bankBalance):'—'}</td></tr>`));
}
function primeiraDataPermitidaFechamento(account){
 const conta=d.accounts.find(a=>a.id===account);
 return conta?.openingDate||null;
}
function mensagemInicioFechamento(account){
 const data=primeiraDataPermitidaFechamento(account);
 return data?'Selecione uma data a partir de '+dataBR(data)+'. Antes disso não há saldo inicial cadastrado para esta conta.':'Cadastre a data do saldo inicial desta conta na aba Bancos antes de realizar o fechamento.';
}
function conferirDiaFechamento(account,date,allowManual){
 const saldo=saldoAteData(account,date);
 const rows=d.bank.filter(b=>b.account===account&&normalizarDataConciliacao(b.date)===date);
 const pendentes=rows.filter(b=>!b.match).length;
 let banco=d.bankDailyBalances?.[account]?.[date];
 if(banco===undefined||banco===null){
  if(allowManual){
   const raw=document.getElementById('closeBankBalance')?.value.trim()||'';
   banco=raw?parseSaldoBR(raw):null;
  }else banco=null;
 }
 const diferenca=banco!==null&&Number.isFinite(Number(banco))&&saldo!==null?Math.round((Number(banco)-saldo)*100)/100:null;
 let motivo='';
 if(saldo===null)motivo='Anterior ao início da conta ('+dataBR(primeiraDataPermitidaFechamento(account)||'')+')';
 else if(!rows.length)motivo='Sem movimentações importadas nesta data';
 else if(pendentes)motivo=pendentes+' movimentação(ões) pendente(s)';
 else if(diferenca===null)motivo='Saldo final do banco não identificado no extrato';
 else if(Math.abs(diferenca)>0.009)motivo='Diferença de saldo: '+money(diferenca);
 return {date,rows,pendentes,saldo,banco,diferenca,motivo,fechado:d.closed.some(c=>c.account===account&&c.date===date)};
}
function renderFechamentoPeriodo(){
 const el=document.getElementById('fechamentoDetalhes');if(!el)return;
 const account=document.getElementById('closeAcc')?.value,inicio=document.getElementById('closeStart')?.value,fim=document.getElementById('closeEnd')?.value;
 if(!account){el.textContent='Selecione uma conta.';return}
 let datas;
 try{datas=datasDoPeriodo(inicio,fim)}catch(err){el.innerHTML='<p class="warn">'+safe(err.message)+'</p>';return}
 const primeira=primeiraDataPermitidaFechamento(account);
 const aviso=(!primeira||datas[0]<primeira)?'<p class="warn">'+safe(mensagemInicioFechamento(account))+'</p>':'';
 const resultados=datas.map(data=>conferirDiaFechamento(account,data,false));
 const aptos=resultados.filter(x=>!x.motivo&&!x.fechado);
 const pendentes=resultados.filter(x=>x.motivo&&!x.fechado);
 const fechados=resultados.filter(x=>x.fechado);
 el.innerHTML=`${aviso}<p><strong>${datas.length} dia(s)</strong> no período — ${aptos.length} apto(s), ${pendentes.length} com pendência, ${fechados.length} já fechado(s).</p>
 <div class="fechamento-tabela">${table(['Data','Movimentos','Pendências','Saldo do sistema','Saldo do banco','Diferença','Situação'],
 resultados.map(x=>`<tr><td>${dataBR(x.date)}</td><td>${x.rows.length}</td><td>${x.pendentes}</td><td>${x.saldo===null?'—':money(x.saldo)}</td><td>${x.banco===null?'—':money(x.banco)}</td><td>${x.diferenca===null?'—':money(x.diferenca)}</td><td>${safe(x.fechado?'Já fechado':x.motivo||'Apto')}</td></tr>`))}</div>
 <div class="actions"><button type="button" onclick="closePeriod()">Fechar período</button></div>
 <p class="muted">O fechamento do período exige todos os dias aptos. Dias já fechados são preservados. Dias anteriores ao período não precisam estar fechados.</p>`;
}
function closePeriod(){
 const account=document.getElementById('closeAcc')?.value;
 if(!d.accounts.some(a=>a.id===account))return alert('Selecione uma conta válida.');
 let datas;
 try{datas=datasDoPeriodo(document.getElementById('closeStart')?.value,document.getElementById('closeEnd')?.value)}
 catch(err){return alert(err.message)}
 const primeira=primeiraDataPermitidaFechamento(account);
 if(!primeira||datas[0]<primeira)return alert(mensagemInicioFechamento(account));
 const resultados=datas.map(data=>conferirDiaFechamento(account,data,false));
 const invalidos=resultados.filter(x=>!x.fechado&&x.motivo);
 if(invalidos.length)return alert('Não foi possível fechar o período.\n'+invalidos.slice(0,8).map(x=>dataBR(x.date)+': '+x.motivo).join('\n')+(invalidos.length>8?'\nE mais '+(invalidos.length-8)+' dia(s).':''));
 const novos=resultados.filter(x=>!x.fechado);
 if(!novos.length)return alert('Todos os dias do período já estão fechados.');
 if(!confirm('Confirmar o fechamento de '+novos.length+' dia(s) da conta '+name(account)+'?'))return;
 const ids=new Set(novos.map(x=>x.date));
 for(const x of novos)d.closed.push({account,date:x.date,bankBalance:Number(x.banco)});
 try{save('Fechamento do período '+datas[0]+' a '+datas[datas.length-1]+' — '+name(account)+' — '+novos.length+' dia(s)')}
 catch(err){d.closed=d.closed.filter(c=>!(c.account===account&&ids.has(c.date)));alert('Não foi possível salvar o fechamento: '+err.message)}
}
function atualizarSaldoFechamento(){
 const conta=document.getElementById('closeAcc')?.value;
 const data=document.getElementById('closeDate')?.value;
 const campo=document.getElementById('closeBankBalance');
 if(!campo)return;
 const saldo=d.bankDailyBalances?.[conta]?.[data];
 if(Number.isFinite(Number(saldo))&&saldo!==undefined&&saldo!==null){
  campo.value=Number(saldo).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  campo.dataset.source='extrato';
  campo.readOnly=true;
  campo.title='Saldo identificado na coluna de saldo do extrato importado';
 }else{
  campo.value='';
  campo.dataset.source='manual';
  campo.readOnly=false;
  campo.title='Saldo não encontrado no extrato; confira e informe manualmente';
 }
}
function renderFechamentoDetalhes(){
 if(document.getElementById('closeMode')?.value==='periodo')return renderFechamentoPeriodo();
 const el=document.getElementById('fechamentoDetalhes');if(!el)return;
 const account=document.getElementById('closeAcc')?.value,date=document.getElementById('closeDate')?.value;
 if(!account||!date){el.innerHTML='<p>Selecione uma conta e uma data.</p>';return}
 const rows=d.bank.filter(b=>b.account===account&&normalizarDataConciliacao(b.date)===date).slice().sort((a,b)=>String(a.description).localeCompare(String(b.description),'pt-BR'));
 const pendentes=rows.filter(b=>!b.match);
 const anteriores=d.bank.filter(b=>b.account===account&&normalizarDataConciliacao(b.date)<date&&!b.match);
 const saldo=saldoAteData(account,date);
 const raw=document.getElementById('closeBankBalance')?.value.trim()||'';
 const saldoBanco=raw?parseSaldoBR(raw):null;
 const diferenca=saldoBanco!==null&&Number.isFinite(saldoBanco)&&saldo!==null?Math.round((saldoBanco-saldo)*100)/100:null;
 const entradas=rows.filter(x=>Number(x.amount)>0).reduce((v,x)=>v+Number(x.amount),0);
 const saidas=rows.filter(x=>Number(x.amount)<0).reduce((v,x)=>v+Math.abs(Number(x.amount)),0);
 const status=saldo===null?mensagemInicioFechamento(account):!rows.length?'Nenhum movimento importado nesta data — confira se o extrato cobre o dia':pendentes.length?'Existem movimentações pendentes nesta data':diferenca===null?'Informe o saldo bancário para comparar':Math.abs(diferenca)>0.009?'Saldo divergente':'Movimentos conciliados e saldos iguais';
 el.innerHTML=`<div class="fechamento-resumo"><div><small>Entradas do extrato</small><strong>${money(entradas)}</strong></div><div><small>Saídas do extrato</small><strong>${money(saidas)}</strong></div><div><small>Saldo calculado</small><strong>${saldo===null?'Indisponível':money(saldo)}</strong></div><div><small>Saldo informado do banco</small><strong>${saldoBanco===null||!Number.isFinite(saldoBanco)?'Não informado':money(saldoBanco)}</strong></div><div><small>Diferença</small><strong>${diferenca===null?'—':money(diferenca)}</strong></div><div><small>Pendências (informativo)</small><strong>${pendentes.length} no dia / ${anteriores.length} anteriores</strong></div></div><p class="${diferenca===0&&!pendentes.length?'inline-note':'warn'}">${safe(status)}</p><div class="fechamento-tabela">${table(['Data','Descrição do extrato','Valor','Situação','Ações'],rows.map(b=>`<tr><td>${safe(dataBR(b.date))}</td><td>${safe(b.description)}</td><td>${money(b.amount)}</td><td>${b.match?'Conciliado':'Pendente'}</td><td>${b.match?'—':`<button type="button" onclick="reconcile('${b.id}')">Localizar</button> <button type="button" onclick="openExtratoLancamento('${b.id}')">Lançamento / baixa / cadastro</button>`}</td></tr>`))}</div><div class="actions"><button type="button" onclick="closeDay()">Confirmar fechamento</button></div>`;
}
function closeDay(){
 const account=document.getElementById('closeAcc')?.value,date=document.getElementById('closeDate')?.value;
 const a=d.accounts.find(x=>x.id===account);
 if(!a||!date)return alert('Selecione conta e data.');
 const saldo=saldoAteData(account,date);
 if(saldo===null)return alert('Data anterior ao saldo inicial cadastrado.');
 const rows=d.bank.filter(b=>b.account===account&&normalizarDataConciliacao(b.date)===date);
 if(!rows.length)return alert('Nenhum movimento importado nessa data. Confirme primeiro a cobertura do extrato.');
 if(rows.some(b=>!b.match))return alert('Existem movimentações pendentes nesta data. Concilie-as antes do fechamento.');
 const raw=document.getElementById('closeBankBalance')?.value.trim()||'';
 if(!raw)return alert('Informe o saldo final apresentado pelo banco.');
 const banco=parseSaldoBR(raw);
 if(!Number.isFinite(banco)||Math.abs(banco-saldo)>0.009)return alert('Saldo bancário e saldo calculado não conferem. Verifique os lançamentos e o saldo informado.');
 if(d.closed.some(c=>c.account===account&&c.date===date))return alert('Essa conta já possui fechamento nessa data.');
 d.closed.push({account,date,bankBalance:banco});
 try{save('Fechamento '+date+' — '+a.name)}catch(err){d.closed=d.closed.filter(c=>!(c.account===account&&c.date===date));alert('Erro ao salvar fechamento: '+err.message)}
}

async function baixarBackupSqlite(){
 try{
  const resp=await fetch('/api/backup',{cache:'no-store'});
  if(!resp.ok)throw Error((await resp.text()).slice(0,200));
  const blob=await resp.blob();
  if(blob.size<1024)throw Error('Backup inesperadamente pequeno.');
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  const now=new Date(),stamp=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+'_'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0');
  a.href=url;a.download='mykey_caixa_backup_'+stamp+'.sqlite3';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
 }catch(err){alert('Falha no backup: '+err.message)}
}
async function restaurarBackupSqlite(event){
 const file=event.target.files?.[0];event.target.value='';if(!file)return;
 if(file.size>100*1024*1024)return alert('Arquivo maior que 100 MB.');
 if(!confirm('A restauração substituirá os dados atuais pelo conteúdo do backup. Você já baixou um backup do estado atual?'))return;
 const code=prompt('Para restaurar '+file.name+', digite RESTAURAR:');if(code!=='RESTAURAR')return;
 try{
  const response=await fetch('/api/restaurar-backup',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Confirmacao':'RESTAURAR'},body:file});
  const result=await response.json();if(!response.ok||!result.ok)throw Error(result.erro||'Falha ao restaurar.');
  alert('Backup restaurado. O sistema será recarregado.');location.reload();
 }catch(err){alert('Restauração não concluída: '+err.message)}
}
async function verificarIntegridade(){
 const root=document.getElementById('configDiagnostico');if(!root)return;
 root.textContent='Verificando banco de dados...';
 try{
  const response=await fetch('/api/diagnostico',{cache:'no-store'}),data=await response.json();
  if(!response.ok)throw Error(data.erro||'Erro de diagnóstico');
  const labels={accounts:'Contas',suppliers:'Cadastros',moves:'Movimentos',bills:'Obrigações',bank:'Extratos',closed:'Fechamentos',recurringRules:'Recorrências'};
  root.innerHTML=`<strong>Integridade SQLite: ${safe(data.integridade)}</strong><p>Última atualização: ${safe(data.ultima_atualizacao||'Não disponível')} | Revisão: ${safe(data.revisao)} | Revisões históricas: ${safe(data.revisoes_guardadas)}</p><div class="config-counts">${Object.entries(data.contagens||{}).map(([key,value])=>`<span>${safe(labels[key]||key)}: <strong>${safe(value)}</strong></span>`).join('')}</div>`;
 }catch(err){root.textContent='Falha na verificação: '+err.message}
}
function limparDadosTeste(){
 const confirmacao=prompt('ATENÇÃO: esta ação apaga definitivamente contas, cadastros, lançamentos, parcelas, extratos, recorrências, fechamentos e histórico de testes.\n\nAntes de continuar, faça uma cópia do arquivo mykey_caixa.sqlite3 com o servidor fechado.\n\nDigite LIMPAR para confirmar:');
 if(confirmacao!=='LIMPAR')return;
 if(!confirm('Confirma a exclusão de TODOS os dados de teste? O sistema ficará vazio, sem contas de exemplo.'))return;
 try{
  const resposta=sqliteRequest('POST',JSON.stringify({confirmacao:'LIMPAR'}),'/api/limpar-testes');
  const retorno=JSON.parse(resposta||'{}');
  if(!retorno.ok)throw new Error('Servidor não confirmou a limpeza.');
  d={accounts:[],moves:[],bills:[],suppliers:[],bank:[],closed:[],audit:[],recurringRules:[],recurringMigrated:true,statementFormats:{},bankDailyBalances:{},futureBank:[]};
  uiSnapshot=null;
  tab=7;
  render();
  alert('Dados de teste eliminados. O sistema está vazio e pronto para cadastrar contas reais.');
 }catch(erro){alert('Falha na limpeza: '+erro.message+'\nNenhum sucesso foi confirmado.');}
}function download(){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.href=url;a.download='mykey-caixa-teste.json';a.click();URL.revokeObjectURL(url)}render();
